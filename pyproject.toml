[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W", "B", "SIM", "RUF100"]
ignore = ["B905"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "normal"
ignore_missing_imports = true
explicit_package_bases = true
warn_unused_ignores = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true
